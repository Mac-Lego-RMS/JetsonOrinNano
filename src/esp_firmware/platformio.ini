; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitm-1]
; pioarduino-Fork: liefert Arduino Core 3.x (ledcAttach/ledcWrite auf Pin-Basis).
; Das offizielle espressif32 im PIO-Registry haengt noch auf Core 2.x.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21/platform-espressif32.zip
board = esp32-s3-devkitm-1
framework = arduino
monitor_speed = 115200

; Ohne CDC_ON_BOOT mappt der Arduino-Core "Serial" auf UART0 (GPIO43/44) statt
; auf den USB-Port - die Konsole bleibt dann komplett stumm. Die Board-Definition
; setzt nur ARDUINO_USB_MODE=1, das Flag hier fehlt ihr. In der Arduino IDE
; entspricht das dem Menuepunkt "USB CDC On Boot: Enabled".
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1

; Die beiden Original-.ino liegen jetzt in reference/ statt src/. PIO wandelt
; jede .ino in src/ nach .cpp um - noch vor build_src_filter - und wuerde an
; doppeltem setup()/loop() scheitern.

lib_deps =
    madhephaestus/ESP32Encoder@^0.11.7
    ; SCServo (Feetech/Waveshare) ist nicht im PIO-Registry:
    ; Bibliotheksordner nach lib/SCServo/ kopieren.

; Notausgang fuers Bring-up: Konsole zusaetzlich auf UART0 (GPIO43 = ESP-TX,
; GPIO44 = ESP-RX), zu lesen mit einem USB-TTL-Adapter bei 115200.
; Sinnvoll, wenn ueber den USB-Port nichts kommt - HWCDC verwirft jede Ausgabe,
; solange der Host die CDC-Verbindung nicht aufgebaut hat. Ein- und Ausgabe
; laufen dann auf beiden Wegen parallel.
;   pio run -e esp32-s3-uart0 -t upload
; Nur benutzen, wenn GPIO43/44 auf dem Board frei sind.
[env:esp32-s3-uart0]
extends = env:esp32-s3-devkitm-1
build_flags =
    ${env:esp32-s3-devkitm-1.build_flags}
    -DCONSOLE_MIRROR_UART0=1
