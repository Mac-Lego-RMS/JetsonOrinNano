; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitm-1]
; pioarduino fork: provides Arduino core 3.x (pin-based ledcAttach/ledcWrite).
; The official espressif32 platform in the PIO registry is still on core 2.x.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21/platform-espressif32.zip
board = esp32-s3-devkitm-1
framework = arduino
monitor_speed = 115200

; Without CDC_ON_BOOT the Arduino core maps "Serial" to UART0 (GPIO43/44)
; instead of the USB port - the console then stays completely silent. The
; board definition only sets ARDUINO_USB_MODE=1 and lacks this flag. In the
; Arduino IDE it corresponds to the menu item "USB CDC On Boot: Enabled".
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1

; Keep standalone sketches out of src/: PIO converts every .ino in src/ to
; .cpp - even before build_src_filter - and would fail on a duplicate
; setup()/loop(). That is why they live in test_sketches/.

lib_deps =
    madhephaestus/ESP32Encoder@^0.11.7
    ; SCServo (Feetech/Waveshare) is not in the PIO registry and is kept
    ; in lib/SCServo/ instead.

; Fallback for bring-up: mirror the console to UART0 as well (GPIO43 = ESP TX,
; GPIO44 = ESP RX), read with a USB-TTL adapter at 115200.
; Useful when nothing arrives over the USB port - HWCDC drops all output as
; long as the host has not opened the CDC connection. Input and output then
; run over both paths in parallel.
;   pio run -e esp32-s3-uart0 -t upload
; Only use it if GPIO43/44 are free on the board.
[env:esp32-s3-uart0]
extends = env:esp32-s3-devkitm-1
build_flags =
    ${env:esp32-s3-devkitm-1.build_flags}
    -DCONSOLE_MIRROR_UART0=1
