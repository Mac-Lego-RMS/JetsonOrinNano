# Calibration of the horizontally mounted 360 degree camera (Raspberry Pi fisheye on the USB port).
#
# Image circle: measured on 12.08.2026 from a live image of /video_source/raw (1280x960)
# -- the circle lies completely inside the image, diameter approx. 903 px.
# Pose: yaw/pitch/roll are still placeholders, they come from
#       ros2 run camera_lidar_fusion rotation_calibration.
#
# This file is the default shipped in the package share. The nodes read
# and write /workspace/config/fisheye_calib.yaml by default and only fall
# back to this one as long as that does not exist yet.

# --- image circle / intrinsics ---
cx: 678.5           # centre of the fisheye circle [px]
cy: 451.0
radius_px: 452.0    # radius of the fisheye circle [px]
fov_deg: 270.0      # full opening angle of the lens
f_px: 0.0           # 0 = derive from radius_px/(fov/2), otherwise fixed focal length
poly_coeffs: []     # optional r = theta*(k0 + k1*theta^2 + ...) instead of equidistant
mirror: false       # true if the image arrives mirrored

# --- pose in the robot frame (X front, Y left, Z up) ---
yaw_deg: 0.0        # rotation about the optical axis -- this is what the node calibrates
pitch_deg: 0.0      # tilt of the optical axis from the vertical
roll_deg: 0.0
cam_x: 0.0          # camera position relative to the lidar origin [m]
cam_y: 0.0
cam_z: 0.05         # height of the camera above the lidar plane [m] -- measure it!

# --- metadata ---
image_width: 1280
image_height: 960
note: 'Default: image circle measured, rotation not calibrated yet.'
